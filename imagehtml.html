<!-- Single image with caption -->
<div class="cs-image">
    <img src="images/screenshot.png" alt="Description">
    <div class="cs-image-caption">CAPTION TEXT HERE</div>
</div>

<!-- Two images side by side -->
<div class="cs-image-pair">
    <div class="cs-image">
        <img src="images/before.png" alt="Before">
        <div class="cs-image-caption">BEFORE</div>
    </div>
    <div class="cs-image">
        <img src="images/after.png" alt="After">
        <div class="cs-image-caption">AFTER</div>
    </div>
</div>

<!-- Hero image at top of case study -->
<div class="cs-hero-image">
    <img src="images/hero.png" alt="Game title shot">
</div>

<!-- Video or GIF -->
<div class="cs-video">
    <video autoplay loop muted playsinline>
        <source src="images/gameplay.mp4" type="video/mp4">
    </video>
    <div class="cs-video-caption">CAPTION TEXT HERE</div>
</div>
